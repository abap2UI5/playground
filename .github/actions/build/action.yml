name: build
description: Install, restore what is expensive to rebuild, build dist/ and check its size.

runs:
  using: composite
  steps:
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 22
        cache: npm

    - run: npm ci
      shell: bash

    # The pinned git dependencies, keyed by the file that pins them: a bump
    # changes the file, which changes the key, which forces a fresh clone.
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: deps
        key: deps-${{ hashFiles('tools/fetch-deps.mjs') }}

    # Where the UI5 tooling puts the OpenUI5 libraries it downloads from npm.
    # The download is the slow half of the frontend build; the build itself is
    # a minute and is not worth caching a hundred megabytes for.
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.ui5
        key: ui5-${{ hashFiles('tools/build-ui5.mjs') }}

    # The downport is three minutes of abaplint rewriting the framework, and it
    # is deterministic. build-framework.mjs stamps the tree with a hash of its
    # inputs and skips the work when the stamp still matches, so a restored
    # cache goes straight to the transpile.
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          build/downport
          build/downport.stamp
        key: downport-${{ hashFiles('tools/fetch-deps.mjs', 'tools/build-framework.mjs', 'src/abap/**', 'package-lock.json') }}

    - run: npm run build
      shell: bash

    - run: node tools/check-size.mjs
      shell: bash

    # The browser binary, keyed by the Playwright version that has to match it -
    # which is pinned in package-lock.json, so that file is the key. A hit turns
    # the download below into a no-op; a Playwright bump misses the key and
    # fetches the browser that version expects.
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ hashFiles('package-lock.json') }}

    # Only the browser, not --with-deps. The runner image already carries the
    # shared libraries Chromium needs, and the apt-get run that --with-deps adds
    # has twice now hung for half an hour on an unreachable Ubuntu mirror and
    # taken the job's whole 30-minute budget with it. A library that really is
    # missing fails loudly when the browser launches, half a minute in, which is
    # a better failure than a silent stall.
    #
    # Still run on a cache hit rather than skipped: it is a few seconds when the
    # binary is already there, and it is what notices a cache that restored
    # something incomplete.
    - name: Install the browser the tests run in
      run: npx playwright install chromium
      shell: bash
