# The abap2UI5 linter ends up INSIDE the bundle a visitor downloads: the
# editor judges the class being typed with exactly the version package.json
# pins (every dependency here is pinned exactly - AGENTS.md "Toolchain").
# That pin sat at 0.2.2 while the linter published 0.6.1: four minors of
# rules missing from the editor, so the playground blessed sources the CI
# gates of every other repository would reject. Dependabot's monthly pass
# never moved it - a 0.x minor counts as a major there and waited in a
# separate PR nobody was watching for.
#
# So the same weekly move the samples repositories run (their
# bump-linter.yaml is the model): resolve `latest`, pin it exactly, run the
# full build and the browser tests as the gate, open a PR. The build itself
# now also fails when the linter's UI5 metadata snapshot and this
# playground's UI5_VERSION disagree (tools/build-ui5.mjs) - that failure is
# meant to land HERE, in the bump PR, not on main.
name: bump-linter

on:
  schedule:
    - cron: '52 6 * * 1'   # Mondays 06:52 UTC - after samples' 06:41
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  # To start check.yml on the PR's branch (below).
  actions: write

jobs:
  bump-linter:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # The same browsers check.yml and pages.yml test in: without the WebKit
      # project, a bump that broke only Safari passed here, merged, and turned
      # main red on the deploy.
      PW_WEBKIT: "1"
    steps:
    # No write token left in .git/config while npm installs a freshly
    # published package and runs the build and the tests over it;
    # create-pull-request authenticates on its own.
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: '22'

    - name: Pin @abap2ui5/linter to the latest published version
      id: pin
      run: |
        set -euo pipefail
        # Resolved first and checked, because `npm view` prints nothing and
        # still exits 0 when a package has no `latest` dist-tag - installing
        # `@abap2ui5/linter@` would then resolve to whatever npm felt like.
        VERSION=$(npm view @abap2ui5/linter version)
        test -n "$VERSION"
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"
        # --save-exact: this repository pins every dependency exactly, the
        # linter is bundled into the page and "whatever resolves today" would
        # change the site under its own tests.
        npm install --save-dev --save-exact "@abap2ui5/linter@$VERSION"
        if git diff --quiet package.json package-lock.json; then
          echo "changed=false" >> "$GITHUB_OUTPUT"
        else
          echo "changed=true" >> "$GITHUB_OUTPUT"
        fi

    # The gate: the same build and browser tests every branch runs. A linter
    # release that breaks the editor, blows the size budget or moves its UI5
    # snapshot away from UI5_VERSION fails this run instead of landing on main.
    - if: steps.pin.outputs.changed == 'true'
      uses: ./.github/actions/build
    - if: steps.pin.outputs.changed == 'true'
      run: npm test

    - if: steps.pin.outputs.changed == 'true'
      id: pr
      uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
      with:
        branch: bump-linter
        title: 'chore: bump @abap2ui5/linter'
        commit-message: 'chore: bump @abap2ui5/linter to ${{ steps.pin.outputs.version }}'
        body: |
          Weekly move of `@abap2ui5/linter` to the latest version on npm
          (${{ steps.pin.outputs.version }}). The full build and the browser
          tests ran green in the workflow that opened this PR.

    # A push or a PR made with the workflow's own GITHUB_TOKEN starts no
    # workflow runs - GitHub's rule against loops - so check.yml never ran on
    # this PR, which showed no checks at all. workflow_dispatch is exempt.
    - if: steps.pr.outputs.pull-request-operation == 'created' || steps.pr.outputs.pull-request-operation == 'updated'
      run: gh workflow run check.yml --ref bump-linter
      env:
        GH_TOKEN: ${{ github.token }}
