name: check

# Builds the playground and runs the tests on every branch and pull request.
# The Pages deployment refuses to publish anything this workflow has not seen
# green, so this is the gate, not a formality.
#
# IN THREE SHARDS. Measured on one runner: the build is two minutes with its
# caches warm and the browser tests are seventeen - a hundred-odd specs, each
# of which boots a whole ABAP runtime in a real browser, on four cores. Three
# runners each take a third of the specs (Playwright's --shard, which splits
# the list and needs no coordination), so the wall clock is the build plus a
# third of the tests, at the price of two more builds that are all cache hits.

on:
  push:
    # main is covered by pages.yml, which runs the same build and tests
    branches-ignore: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Keyed by BRANCH NAME, not by `github.ref`, because the two triggers above
# both fire for a branch that has a pull request open — and `github.ref` is
# `refs/heads/<branch>` for the push and `refs/pull/<n>/merge` for the pull
# request. Two different groups, so neither cancelled the other and every PR
# branch built and ran the 106 browser tests twice, concurrently, for the same
# commit. `github.head_ref` is the source branch on a pull request and empty
# otherwise, so this collapses both to one name and `cancel-in-progress` keeps
# the newer run.
concurrency:
  group: check-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # The WebKit project of playwright.config.js: boot, embed and shell on
      # Safari's engine, the browser the two costliest incidents here were
      # specific to. Opt-in, so a desk's `npm test` stays Chromium-only.
      PW_WEBKIT: "1"
    strategy:
      # Every shard reports, so one red shard does not hide what the other two
      # found.
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/build
      - run: npm test -- --shard=${{ matrix.shard }}/3

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-report-${{ matrix.shard }}
          path: playwright-report/
          retention-days: 7
