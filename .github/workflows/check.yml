name: check

# Builds the playground and runs the tests on every branch and pull request.
# The Pages deployment refuses to publish anything this workflow has not seen
# green, so this is the gate, not a formality.

on:
  push:
    # main is covered by pages.yml, which runs the same build and tests
    branches-ignore: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Keyed by BRANCH NAME, not by `github.ref`, because the two triggers above
# both fire for a branch that has a pull request open — and `github.ref` is
# `refs/heads/<branch>` for the push and `refs/pull/<n>/merge` for the pull
# request. Two different groups, so neither cancelled the other and every PR
# branch built and ran the 106 browser tests twice, concurrently, for the same
# commit. `github.head_ref` is the source branch on a pull request and empty
# otherwise, so this collapses both to one name and `cancel-in-progress` keeps
# the newer run.
concurrency:
  group: check-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/build
      - run: npm test

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
