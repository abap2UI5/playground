name: check

# Builds the playground and runs the tests on every branch and pull request.
# The Pages deployment refuses to publish anything this workflow has not seen
# green, so this is the gate, not a formality.

on:
  push:
    # main is covered by pages.yml, which runs the same build and tests
    branches-ignore: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The pinned git dependencies are keyed by the pin file itself: a bump
      # changes the file, which changes the key, which forces a fresh clone.
      - uses: actions/cache@v4
        with:
          path: deps
          key: deps-${{ hashFiles('tools/fetch-deps.mjs') }}

      - run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - run: npm test

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
