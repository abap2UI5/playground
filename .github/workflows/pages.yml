name: pages

# Publishes dist/ to GitHub Pages. Runs the same build and the same tests as
# check.yml before deploying - a red test never reaches the published page.
#
# ALSO ON A SCHEDULE, which a static site would not normally need. The sample
# catalogue at /samples/ is built from the six catalogues the three sample
# repositories commit (tools/build-catalogue.mjs), and those change when a
# sample is merged THERE - which is no reason for anything to be pushed here.
# Without this, a sample merged the day after a playground deploy would wait
# for the next unrelated commit to show up in the catalogue. Daily, which is
# the freshness the examples dialog used to get from its 24-hour cache of the
# same catalogues, and cheap: every build step is stamped, so a run that finds
# nothing changed rebuilds only the site and the index.
#
# Nightly rather than triggered from the three repositories: a repository_
# dispatch would need a token held over there, and none of this is urgent
# enough to be worth one.
#
# THE DOCUMENTATION IS TOLD, though, when this site has been published. Its
# build borrows the bar, the bar's script and two stylesheets from THIS
# deployment (scripts/build-site.mjs over there), so a change to the bar here
# reached the manual's 167 pages only with the manual's next push - until
# then there were two bars. The `notify-docs` job below sends abap2UI5/docs a
# repository_dispatch after a successful deploy. It needs a fine-grained token
# held in this repository's secrets as DOCS_DISPATCH_TOKEN (contents: write on
# abap2UI5/docs, nothing else); without the secret the job does nothing and
# says so, and the manual's own nightly deploy is what catches up instead.

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # The tests, in the same three shards check.yml runs them in - the build
  # is two minutes with its caches warm and the tests seventeen on one
  # runner, so three runners each take a third (Playwright's --shard) and the
  # wall clock is the build plus a third of the tests.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/build
      - run: npm test -- --shard=${{ matrix.shard }}/3

  # The artefact that is published: the same build, once more, on a runner
  # of its own - a cache hit, and it runs beside the shards rather than after
  # them. Deploy waits for all four.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/build

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    needs: [test, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0

  # ...and the documentation rebuilds itself against what was just published.
  notify-docs:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TOKEN: ${{ secrets.DOCS_DISPATCH_TOKEN }}
    steps:
      - name: Tell abap2UI5/docs to redeploy
        if: ${{ env.TOKEN != '' }}
        run: |
          curl --fail --silent --show-error \
            -X POST "https://api.github.com/repos/abap2UI5/docs/dispatches" \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $TOKEN" \
            -d '{"event_type":"playground-published","client_payload":{"sha":"${{ github.sha }}"}}'
      - name: No token, no dispatch
        if: ${{ env.TOKEN == '' }}
        run: echo "DOCS_DISPATCH_TOKEN is not set - abap2UI5/docs will pick up this deploy on its own nightly run."
